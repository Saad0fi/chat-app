name: sao
description: "Real-time chat app — Flutter BLoC + Supabase (portfolio showcase)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  dart_mappable: ^4.6.1
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  flutter_dotenv: ^6.0.0
  supabase_flutter: ^2.10.3
  flutter_localizations:
    sdk: flutter
  flutter_chat_core: ^2.0.0
  flutter_chat_ui: ^2.0.0

  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.10.1
  dart_mappable_builder: ^4.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env
